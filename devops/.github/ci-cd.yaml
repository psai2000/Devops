# =============================================================================
# CI/CD Pipeline — Build, Test, Push to ECR, Deploy to EKS
# =============================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/ci-cd.yaml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "helm/**"

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: lucidity/hello-world
  EKS_CLUSTER_NAME: lucidity-dev-eks
  HELM_RELEASE: hello-world
  HELM_NAMESPACE: default

# Prevent concurrent deployments to the same environment
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: Test
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: app
        run: pytest -v test_app.py

      - name: Lint check
        working-directory: app
        run: python -m py_compile app.py

  # ===========================================================================
  # Job 2: Build and Push Docker image to ECR
  # ===========================================================================
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_uri: ${{ steps.build.outputs.image_uri }}

    permissions:
      id-token: write   # Required for OIDC
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${SHA_SHORT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "registry=${{ steps.ecr-login.outputs.registry }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        working-directory: app
        run: |
          IMAGE_URI="${{ steps.meta.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.version }}"
          
          docker build \
            --build-arg VERSION=${{ steps.meta.outputs.version }} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t "${IMAGE_URI}" \
            -t "${{ steps.meta.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            .
          
          docker push "${IMAGE_URI}"
          docker push "${{ steps.meta.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 3: Deploy to EKS using Helm
  # ===========================================================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.2"

      - name: Deploy with Helm
        run: |
          ECR_REGISTRY=$(aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPOSITORY }} \
            --query 'repositories[0].repositoryUri' \
            --output text | sed 's|/.*||')
          
          IMAGE_REPO="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          
          helm upgrade --install ${{ env.HELM_RELEASE }} \
            ./helm/hello-world \
            --namespace ${{ env.HELM_NAMESPACE }} \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=Always \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }} \
            -n ${{ env.HELM_NAMESPACE }} --timeout=120s
          
          echo ""
          echo "=== Deployment Status ==="
          kubectl get deployment ${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }}
          
          echo ""
          echo "=== Service Endpoint ==="
          kubectl get svc ${{ env.HELM_RELEASE }} -n ${{ env.HELM_NAMESPACE }}
          
          echo ""
          echo "=== Running Pods ==="
          kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app.kubernetes.io/name=hello-world

  # ===========================================================================
  # Job 4: Smoke test the deployed service
  # ===========================================================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Run smoke tests
        run: |
          # Use port-forward for reliable testing
          kubectl port-forward svc/${{ env.HELM_RELEASE }} 8080:80 \
            -n ${{ env.HELM_NAMESPACE }} &
          PF_PID=$!
          sleep 5
          
          echo "==> Testing /hello endpoint"
          RESPONSE=$(curl -sf http://localhost:8080/hello)
          echo "Response: ${RESPONSE}"
          echo "${RESPONSE}" | grep -q "Hello World" || { echo "FAIL: /hello"; exit 1; }
          
          echo "==> Testing /healthz endpoint"
          curl -sf http://localhost:8080/healthz | grep -q "alive" || { echo "FAIL: /healthz"; exit 1; }
          
          echo "==> Testing /readyz endpoint"
          curl -sf http://localhost:8080/readyz | grep -q "ready" || { echo "FAIL: /readyz"; exit 1; }
          
          echo "==> Testing /metrics endpoint"
          curl -sf http://localhost:8080/metrics | grep -q "http_requests_total" || { echo "FAIL: /metrics"; exit 1; }
          
          kill $PF_PID 2>/dev/null || true
          echo ""
          echo "✅ All smoke tests passed!"

