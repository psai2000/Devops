# =============================================================================
# Bootstrap — One-time setup of S3 backend, DynamoDB lock table, and ECR repo
# Run this ONCE manually via GitHub Actions → "Run workflow"
# After this, all other workflows will work automatically
# =============================================================================
name: Bootstrap AWS Resources

on:
  workflow_dispatch:
    inputs:
      s3_bucket_name:
        description: "S3 bucket name for Terraform state (must be globally unique)"
        required: true
        default: "lucidity-tfstate-CHANGE-ME"
      aws_region:
        description: "AWS region"
        required: true
        default: "ap-south-1"

env:
  AWS_REGION: ${{ github.event.inputs.aws_region }}

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS access
        run: |
          echo "=== AWS Identity ==="
          aws sts get-caller-identity
          echo ""
          echo "Region: ${{ env.AWS_REGION }}"

      - name: Create S3 bucket for Terraform state
        run: |
          BUCKET="${{ github.event.inputs.s3_bucket_name }}"

          if aws s3api head-bucket --bucket "${BUCKET}" 2>/dev/null; then
            echo "✅ S3 bucket '${BUCKET}' already exists"
          else
            echo "Creating S3 bucket: ${BUCKET}"
            aws s3api create-bucket \
              --bucket "${BUCKET}" \
              --region ${{ env.AWS_REGION }} \
              --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
            
            # Enable versioning (protects state from accidental overwrites)
            aws s3api put-bucket-versioning \
              --bucket "${BUCKET}" \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket "${BUCKET}" \
              --server-side-encryption-configuration '{
                "Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]
              }'
            
            # Block public access
            aws s3api put-public-access-block \
              --bucket "${BUCKET}" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            
            echo "✅ S3 bucket '${BUCKET}' created with versioning and encryption"
          fi

      - name: Create DynamoDB lock table
        run: |
          TABLE="terraform-locks"

          if aws dynamodb describe-table --table-name "${TABLE}" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✅ DynamoDB table '${TABLE}' already exists"
          else
            echo "Creating DynamoDB table: ${TABLE}"
            aws dynamodb create-table \
              --table-name "${TABLE}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ env.AWS_REGION }}

            aws dynamodb wait table-exists --table-name "${TABLE}" --region ${{ env.AWS_REGION }}
            echo "✅ DynamoDB table '${TABLE}' created"
          fi

      - name: Create ECR repository
        run: |
          REPO="lucidity/hello-world"

          if aws ecr describe-repositories --repository-names "${REPO}" --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✅ ECR repository '${REPO}' already exists"
          else
            echo "Creating ECR repository: ${REPO}"
            aws ecr create-repository \
              --repository-name "${REPO}" \
              --region ${{ env.AWS_REGION }} \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
            echo "✅ ECR repository '${REPO}' created"
          fi

      - name: Print next steps
        run: |
          BUCKET="${{ github.event.inputs.s3_bucket_name }}"
          cat << EOF

          ============================================================
          ✅ Bootstrap complete!
          ============================================================

          Next steps:

          1. Update terraform/versions.tf — uncomment the backend block
             and set the bucket name to: ${BUCKET}

             backend "s3" {
               bucket         = "${BUCKET}"
               key            = "eks/terraform.tfstate"
               region         = ${{ env.AWS_REGION }}
               dynamodb_table = "terraform-locks"
               encrypt        = true
             }

          2. Commit and push the change to main.

          3. The Terraform workflow will automatically run and
             provision the EKS cluster (~15 minutes).

          4. Once infra is up, trigger the CI/CD Pipeline workflow
             manually (or push an app/ change) to build and deploy.

          ============================================================
          EOF

