# =============================================================================
# Terraform — Provision all AWS infrastructure via GitHub Actions
# Includes: VPC, EKS, IAM, ECR repository
# =============================================================================
name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  # Allow manual trigger for first-time setup
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: terraform

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ===========================================================================
  # Terraform Validate & Plan
  # ===========================================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan -no-color
        continue-on-error: false

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📋
            
            \`\`\`
            Plan output is available in the workflow run logs.
            \`\`\`
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # ===========================================================================
  # Terraform Apply (main branch or manual trigger)
  # ===========================================================================
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    outputs:
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
      cluster_endpoint: ${{ steps.outputs.outputs.cluster_endpoint }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Extract Terraform outputs
        id: outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)" >> "$GITHUB_OUTPUT"

      - name: Verify cluster is reachable
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ steps.outputs.outputs.cluster_name }}
          echo "=== Cluster Info ==="
          kubectl cluster-info
          echo ""
          echo "=== Nodes ==="
          kubectl get nodes

  # ===========================================================================
  # Create ECR repository (runs after infra is up)
  # ===========================================================================
  create-ecr:
    name: Create ECR Repository
    runs-on: ubuntu-latest
    needs: apply

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository (idempotent)
        run: |
          aws ecr describe-repositories \
            --repository-names lucidity/hello-world \
            --region ${{ env.AWS_REGION }} 2>/dev/null \
          || aws ecr create-repository \
            --repository-name lucidity/hello-world \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256
          
          echo "✅ ECR repository lucidity/hello-world is ready"

  # ===========================================================================
  # Install monitoring stack (runs after infra is up)
  # ===========================================================================
  install-monitoring:
    name: Install Monitoring
    runs-on: ubuntu-latest
    needs: apply

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ needs.apply.outputs.cluster_name }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.2"

      - name: Apply gp3 StorageClass
        run: kubectl apply -f monitoring/storageclass.yaml

      - name: Install kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          
          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --version 58.2.2 \
            --values monitoring/values-prometheus-stack.yaml \
            --wait --timeout 10m

      - name: Apply Grafana dashboard and alerts
        run: |
          kubectl apply -f monitoring/hello-world-dashboard-configmap.yaml
          kubectl apply -f monitoring/alerts.yaml

      - name: Verify monitoring stack
        run: |
          echo "=== Prometheus ==="
          kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus
          echo ""
          echo "=== Grafana ==="
          kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana
          echo ""
          echo "=== Grafana Service ==="
          kubectl get svc -n monitoring monitoring-grafana
          echo ""
          echo "✅ Monitoring stack is running"

